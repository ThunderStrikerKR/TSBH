name: Product modal exact rect audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/egui-modal-rect-audit.yml
      - egui-app/src/components.rs
      - egui-app/src/product_manager.rs
      - egui-app/src/theme.rs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: egui-modal-rect-${{ github.ref }}
  cancel-in-progress: false
jobs:
  geometry:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: egui-app -> target
      - name: Measure actual egui Rects for header cards divider and footer
        run: cargo test --manifest-path egui-app/Cargo.toml modal_editor_workspace_geometry_tests -- --nocapture

name: Product modal exact rect audit
on:
  # Automatic coverage is provided by egui-targeted-check.yml.
  # Retain this focused workflow for explicit troubleshooting.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: egui-modal-rect-${{ github.ref }}
  cancel-in-progress: false
jobs:
  geometry:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: egui-app -> target
      - name: Measure actual egui Rects for header cards divider and footer
        run: cargo test --manifest-path egui-app/Cargo.toml modal_editor_workspace_geometry_tests -- --nocapture

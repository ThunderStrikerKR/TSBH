  sqlite-regression:
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: resolved-cargo-locks
          path: lock-output
      - name: Validate patched SQLite and synthetic backup restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($dir in @('egui-app','crates/bando-data-access','src-tauri')) {
            Copy-Item -LiteralPath "lock-output/$dir/Cargo.lock" -Destination "$dir/Cargo.lock" -Force
          }
          cargo test --locked --manifest-path crates/bando-data-access/Cargo.toml backup_service::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked --manifest-path egui-app/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($filter in @('native_workbooks::','product_excel::','factory_reply_inbox::','excel_service::','excel_aggregate::')) {
            cargo test --locked --manifest-path egui-app/Cargo.toml $filter
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

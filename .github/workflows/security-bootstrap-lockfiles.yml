            }
            Write-Output "LOCK_END:$path"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resolved-cargo-locks
          path: |
            egui-app/Cargo.lock
            crates/bando-data-access/Cargo.lock
          if-no-files-found: error
          retention-days: 3

name: Native reception and SQLite regression
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/src/**'
      - 'crates/bando-data-access/**'
      - 'tests/reception-rust/**'
      - '.github/workflows/verify-tauri.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/src/**'
      - 'crates/bando-data-access/**'
      - 'tests/reception-rust/**'
      - '.github/workflows/verify-tauri.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-reception-sqlite-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-reception:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust receipt boundary unit tests (no Tauri GUI libraries)
        run: cargo test --manifest-path tests/reception-rust/Cargo.toml

  windows-native-sqlite:
    name: Windows SQLite persistence and Rust tests
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-targets: true
      - name: Test real app Rust / SQLite persistence on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture

name: Native dependency security audit
on:
  push:
    branches: [security/v0.8.0-pre-release]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    if: >-
      github.ref == 'refs/heads/security/v0.8.0-pre-release' ||
      (github.event_name == 'pull_request' &&
      github.head_ref == 'security/v0.8.0-pre-release' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        crate: [egui-app, crates/bando-data-access]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require tracked lockfile and validate resolved graph
        env:
          CRATE_DIR: ${{ matrix.crate }}
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch "$CRATE_DIR/Cargo.lock"
          test -f "$CRATE_DIR/Cargo.lock"
          cargo fetch --locked --target x86_64-pc-windows-msvc --manifest-path "$CRATE_DIR/Cargo.toml"
          git diff --exit-code -- "$CRATE_DIR/Cargo.lock"
      - name: Install pinned RustSec auditor
        working-directory: ${{ runner.temp }}
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit exact committed lockfile (RustSec)
        env:
          CRATE_DIR: ${{ matrix.crate }}
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          cargo audit --version
          cargo audit --file "$GITHUB_WORKSPACE/$CRATE_DIR/Cargo.lock"
  python:
    if: >-
      github.ref == 'refs/heads/security/v0.8.0-pre-release' ||
      (github.event_name == 'pull_request' &&
      github.head_ref == 'security/v0.8.0-pre-release' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact OCR dependency inventory
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch security/ocr/requirements.lock
          python3 scripts/validate-ocr-audit-lock.py security/ocr/requirements.lock
      - name: Install pinned auditor in isolated environment
        working-directory: ${{ runner.temp }}
        run: |
          python3 -m venv audit-venv
          audit-venv/bin/python -m pip --isolated install --disable-pip-version-check --only-binary=:all: pip-audit==2.10.1
      - name: Audit pinned OCR dependencies without installing OCR
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          audit-venv/bin/python -m pip_audit --version
          audit-venv/bin/python -m pip_audit --strict --disable-pip --require-hashes -r "$GITHUB_WORKSPACE/security/ocr/requirements.lock"

  xlsx-resource:
    if: >-
      github.ref == 'refs/heads/security/v0.8.0-pre-release' ||
      (github.event_name == 'pull_request' &&
      github.head_ref == 'security/v0.8.0-pre-release' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require actual XLSX boundary regression execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = cargo test --locked --manifest-path egui-app/Cargo.toml native_workbooks::xlsx_resource_tests:: 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) { exit $code }
          $matches = [regex]::Matches($output,'test result: ok\. (\d+) passed; 0 failed')
          if (!($matches | Where-Object { [int]$_.Groups[1].Value -ge 11 })) { throw 'Expected at least eleven passing XLSX resource regression tests.' }

      - name: Verify standard operating DB path on isolated fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = cargo test --locked --manifest-path egui-app/Cargo.toml business_state::auto_database_location_tests:: 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) { exit $code }
          $results = [regex]::Matches($output,'test result: ok\. (\d+) passed; 0 failed')
          if (!($results | Where-Object { [int]$_.Groups[1].Value -ge 7 })) { throw 'Expected at least seven passing database-path tests.' }

      - name: Verify private data file permissions on synthetic fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = cargo test --locked --manifest-path egui-app/Cargo.toml private_storage::tests:: 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) { exit $code }
          $results = [regex]::Matches($output,'test result: ok\. (\d+) passed; 0 failed')
          if (!($results | Where-Object { [int]$_.Groups[1].Value -ge 3 })) { throw 'Expected at least three private storage regression tests.' }

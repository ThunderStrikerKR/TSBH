name: UI visual evidence gate

# Optional human review only; not part of automatic CI or completion criteria.
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base commit for optional human visual review"
        required: true
        type: string

permissions:
  contents: read

jobs:
  visual-evidence:
    name: Visual evidence / not a screenshot runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify visual gate rules
        run: node --test tests/ui-visual-verification.test.mjs
      - name: Require version-bound human visual review for changed UI
        env:
          UI_DIFF_BASE: ${{ inputs.base }}
        run: |
          if [ -z "$UI_DIFF_BASE" ]; then
            echo "Missing diff base: fail closed" >&2
            exit 1
          fi
          node scripts/check-ui-visual-verification.mjs --base "$UI_DIFF_BASE"

name: Manual classification modal and linked-highlight regression
on:
  # Automatic coverage is provided by egui-manual-classification-check.yml.
  # Retain this focused workflow for explicit troubleshooting.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: egui-manual-modal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  manual-modal-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: egui-app -> target
      - name: Check the native egui application compiles
        run: cargo check --manifest-path egui-app/Cargo.toml
      - name: Reproduce modal pointer clicks and shared linked-cell blue emphasis
        run: cargo test --manifest-path egui-app/Cargo.toml manual_nested_prompt_regression_tests -- --nocapture
      - name: Verify manual modal routing and Esc fallback
        run: cargo test --manifest-path egui-app/Cargo.toml manual_workspace_modal_routing_tests -- --nocapture
      - name: Verify shared manual source hit testing and click-to-assign
        run: cargo test --manifest-path egui-app/Cargo.toml manual_source_view::tests -- --nocapture
      - name: Verify source span identity, bidirectional manual projection and hover delays
        run: cargo test --manifest-path egui-app/Cargo.toml source_highlight::tests -- --nocapture

name: Client tag and freight-master table layout verification
on:
  # Main automatic coverage is consolidated in egui-manual-classification-check.yml.
  # Keep this focused workflow for explicit troubleshooting.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  egui-client-ui:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: egui-app -> target
      - name: Compile native egui client management
        run: cargo check --manifest-path egui-app/Cargo.toml
      - name: Verify client preferred-account options and stored selection semantics
        run: cargo test --manifest-path egui-app/Cargo.toml client_account_picker_tests -- --nocapture
      - name: Verify search-tag add, duplicate prevention and individual removal
        run: cargo test --manifest-path egui-app/Cargo.toml client_search_tags::tests -- --nocapture
      - name: Verify the same header and row column-divider positions
        run: cargo test --manifest-path egui-app/Cargo.toml management_client_column_divider_tests -- --nocapture

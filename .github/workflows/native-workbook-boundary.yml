name: Native client and factory XLSX boundary
on:
  push:
    branches: [main]
    paths:
      - 'egui-app/src/native_workbooks.rs'
      - 'egui-app/src/factory_reply_inbox.rs'
      - 'egui-app/src/excel_manager.rs'
      - 'src-tauri/src/business_core/rules/mod.rs'
      - 'egui-app/tests/native_workbooks.rs'
      - 'egui-app/Cargo.toml'
      - 'egui-app/src/client_master.rs'
      - 'egui-app/src/client_manager.rs'
      - 'egui-app/src/product_excel_ui.rs'
      - 'egui-app/src/gateway.rs'
      - 'crates/bando-data-access/**'
      - 'src-tauri/src/business_core/catalog_clients/**'
      - 'src-tauri/src/business_core/rules/factory_reply.rs'
      - '.github/workflows/native-workbook-boundary.yml'
  pull_request:
    paths:
      - 'egui-app/src/native_workbooks.rs'
      - 'egui-app/src/factory_reply_inbox.rs'
      - 'egui-app/src/excel_manager.rs'
      - 'src-tauri/src/business_core/rules/mod.rs'
      - 'egui-app/tests/native_workbooks.rs'
      - 'egui-app/Cargo.toml'
      - 'egui-app/src/client_master.rs'
      - 'egui-app/src/client_manager.rs'
      - 'egui-app/src/product_excel_ui.rs'
      - 'egui-app/src/gateway.rs'
      - 'crates/bando-data-access/**'
      - 'src-tauri/src/business_core/catalog_clients/**'
      - 'src-tauri/src/business_core/rules/factory_reply.rs'
      - '.github/workflows/native-workbook-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-xlsx:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: egui-app -> target
      - name: Verify actual binary XLSX and native business rules
        run: cargo test --manifest-path egui-app/Cargo.toml --test native_workbooks -- --nocapture
      - name: Verify client workbook transactional backup and CAS
        run: cargo test --manifest-path crates/bando-data-access/Cargo.toml --lib client_workbook_ -- --nocapture
      - name: Verify shared Excel review and approval UI
        run: cargo test --manifest-path egui-app/Cargo.toml --bin bando-hub-egui product_excel_ui::tests -- --nocapture
      - name: Verify native factory inbox stable observations and immutable originals
        run: cargo test --manifest-path egui-app/Cargo.toml --bin bando-hub-egui factory_reply_inbox::tests -- --nocapture

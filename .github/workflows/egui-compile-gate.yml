name: Windows egui compile gate
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/egui-compile-gate.yml
      - egui-app/**
      - src-tauri/src/business_core/rules/history.rs
      - src-tauri/src/business_core/rules/manual_draft.rs
      - src-tauri/src/workflow_sqlite_integration_tests.rs
      - src-tauri/src/business_core/rules/pricing.rs
      - src-tauri/src/business_core/catalog_clients/brands.rs
      - src-tauri/src/business_core/catalog_clients/aliases.rs
      - src-tauri/src/business_core/catalog_clients/model_groups.rs
      - crates/bando-data-access/**
      - src-tauri/src/business_core/catalog_clients/categories.rs
      - src-tauri/src/egui_shipping_bridge.rs
      - src-tauri/src/main.rs
      - src-tauri/src/lib.rs
      - src-tauri/src/backup_manager.rs
      - src-tauri/src/relational_store.rs
      - src-tauri/src/sale_unit_migration.rs
      - src-tauri/src/business_core/rules/reception_merge.rs
      - src-tauri/resources/legacy-state-seed-303.json
      - src-tauri/src/business_core/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/egui-compile-gate.yml
      - egui-app/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer source revision supersedes only this short compile check.
  group: egui-compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: egui-app -> target
          key: egui-compile
      - name: Compile current Windows egui source
        run: cargo check --manifest-path egui-app/Cargo.toml
      - name: Mandatory popup geometry and editor placement contracts
        shell: pwsh
        run: |
          $names = @(
            'ui_regressions::notice_no_reflow_contract_tests::guard_detects_direct_feedback_and_multiline_input_hint',
            'ui_regressions::notice_no_reflow_contract_tests::production_screens_reject_direct_inline_transient_notices',
            'brand_manager::modal_lifecycle_tests::actual_brand_popup_feedback_never_moves_controls',
            'brand_manager::modal_lifecycle_tests::brand_delete_request_requires_original_entity_and_preserves_draft_on_failure',
            'product_manager::tests::brand_selector_supports_korean_names_and_registered_aliases',
            'freight_manager::group_editor_renames_and_changes_rates_in_one_command',
            'freight_manager::group_and_combination_tables_open_details_without_action_columns',
            'freight_manager::freight_group_and_combination_cell_click_opens_existing_record',
            'catalog_query_bridge::native_queries::tests::brand_filter_distinguishes_all_unassigned_and_registered',
            'popup::regression_tests::shared_editor_footer_keeps_delete_left_and_save_right',
            'popup::regression_tests::actual_common_popup_families_keep_geometry_during_feedback_and_permissions',
            'alias_manager::modal_lifecycle_tests::actual_alias_popup_feedback_and_permissions_keep_rects',
            'category_manager::modal_layout_contract_tests::actual_category_editor_keeps_rects_during_permission_and_busy_changes',
            'model_group_manager::responsiveness_tests::actual_model_group_editor_keeps_rects_during_permission_and_feedback_changes',
            'client_manager::client_inline_form_tests::actual_client_editor_keeps_rects_during_permission_changes',
            'product_manager::tests::actual_product_detail_keeps_rects_during_dirty_state_changes',
            'product_manager::tests::rendered_product_detail_measures_real_card_order_and_master_gaps',
            'product_manager::tests::rendered_detail_price_fields_match_half_width_sale_status',
            'item_editor::tests::actual_item_detail_keeps_rects_during_error_and_busy_changes',
            'notification_center::shared_notification_center_screen_geometry_tests::actual_notification_popup_keeps_rects_during_read_and_error_changes',
            'ui_regressions::general_screen_geometry_tests::actual_product_chooser_uses_modal_body_not_management_page_anchor',
            'popup::regression_tests::modal_editor_workspace_geometry_tests::actual_flow_modal_keeps_chrome_and_action_rects_when_permission_changes',
            'popup::regression_tests::round87_modal_flow_contract_tests::flow_regions_measure_master_vertical_gaps_at_normal_and_compact_widths',
            'popup::regression_tests::round87_phase5_modal_contract_tests::production_screens_do_not_bypass_shared_modal_chrome_or_decision_entry',
            'floating_notice::shared_floating_notice_rendered_geometry_tests::actual_notice_paint_stays_within_screen_without_moving_underlying_controls',
            'ui_regressions::shared_placeholder_color_contract_tests::actual_input_hints_keep_approved_ink_when_empty_hovered_and_focused',
            'ui_regressions::shared_placeholder_color_contract_tests::actual_dropdown_caption_ink_distinguishes_selection_and_valid_empty_filters',
            'ui_regressions::shared_placeholder_color_contract_tests::production_input_hints_must_use_shared_placeholder_builder'
          )
          foreach ($name in $names) {
            $listed = cargo test --manifest-path egui-app/Cargo.toml $name -- --exact --list
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not ($listed | Where-Object { $_ -eq "${name}: test" })) { throw "Missing mandatory UI regression: $name" }
            cargo test --manifest-path egui-app/Cargo.toml $name -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Mandatory shared design ownership and rendered control contracts
        shell: pwsh
        run: |
          $groups = @(
            'ui_regressions::shared_general_screen_audit_tests::',
            'ui_regressions::inline_labeled_form_contract_tests::',
            'ui_regressions::structural_divider_contract_tests::',
            'ui_regressions::fixed_layout_slot_contract_tests::',
            'ui_regressions::shared_selection_interaction_tests::',
            'ui_regressions::shared_tag_chip_contract_tests::',
            'ui_regressions::common_action_tooltip_tests::',
            'table::regression_tests::shared_table_rendered_geometry_tests::',
            'checkbox::regression_tests::shared_checkbox_rendered_geometry_tests::',
            'card::regression_tests::shared_card_rendered_geometry_tests::',
            'scrollbar::regression_tests::shared_scrollbar_rendered_geometry_tests::',
            'button::regression_tests::shared_button_rendered_geometry_tests::',
            'input::regression_tests::shared_input_rendering_tests::',
            'input::regression_tests::shared_input_width_rendered_geometry_tests::',
            'dropdown::regression_tests::shared_dropdown_rendered_geometry_tests::',
            'typography::management_table_type_roles_tests::',
            'typography::shared_text_hierarchy_contract_tests::'
          )
          foreach ($group in $groups) {
            $listed = cargo test --manifest-path egui-app/Cargo.toml $group -- --list
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $matching = @($listed | Where-Object { $_ -like "$group*" -and $_ -like "*: test" })
            if ($matching.Count -eq 0) { throw "Missing mandatory design contract group: $group" }
            cargo test --manifest-path egui-app/Cargo.toml $group -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Mandatory native brand deletion safety
        shell: pwsh
        run: |
          $filters = @(
            'brand_delete_only_removes_the_selected_unreferenced_brand',
            'brand_delete_detaches_only_confirmed_product_references',
            'brand_delete_requires_original_entity_and_rejects_stale_edits',
            'brand_delete_rejects_stale_product_editor_relink'
          )
          foreach ($filter in $filters) {
            $listed = cargo test --manifest-path crates/bando-data-access/Cargo.toml --lib $filter -- --list
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not ($listed | Where-Object { $_ -like "*${filter}: test" })) { throw "Missing brand deletion regression: $filter" }
            cargo test --manifest-path crates/bando-data-access/Cargo.toml --lib $filter -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

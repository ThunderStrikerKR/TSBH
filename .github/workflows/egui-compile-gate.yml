name: Windows egui compile gate
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/egui-compile-gate.yml
      - egui-app/**
      - src-tauri/src/business_core/rules/history.rs
      - src-tauri/src/business_core/rules/manual_draft.rs
      - src-tauri/src/workflow_sqlite_integration_tests.rs
      - src-tauri/src/business_core/rules/pricing.rs
      - src-tauri/src/business_core/catalog_clients/brands.rs
      - src-tauri/src/business_core/catalog_clients/aliases.rs
      - src-tauri/src/business_core/catalog_clients/model_groups.rs
      - crates/bando-data-access/**
      - src-tauri/src/business_core/catalog_clients/categories.rs
      - src-tauri/src/egui_shipping_bridge.rs
      - src-tauri/src/main.rs
      - src-tauri/src/lib.rs
      - src-tauri/src/backup_manager.rs
      - src-tauri/src/relational_store.rs
      - src-tauri/src/sale_unit_migration.rs
      - src-tauri/src/business_core/rules/reception_merge.rs
      - src-tauri/resources/legacy-state-seed-303.json
      - src-tauri/src/business_core/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/egui-compile-gate.yml
      - egui-app/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer source revision supersedes only this short compile check.
  group: egui-compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: egui-app -> target
          key: egui-compile
      - name: Compile current Windows egui source
        run: cargo check --manifest-path egui-app/Cargo.toml
      - name: Mandatory UI notice no-reflow and editor footer contracts
        shell: pwsh
        run: |
          $names = @(
            'ui_regressions::notice_no_reflow_contract_tests::guard_detects_direct_feedback_and_multiline_input_hint',
            'ui_regressions::notice_no_reflow_contract_tests::production_screens_reject_direct_inline_transient_notices',
            'brand_manager::modal_lifecycle_tests::actual_brand_popup_feedback_never_moves_controls',
            'popup::regression_tests::shared_editor_footer_keeps_delete_left_and_save_right'
          )
          foreach ($name in $names) {
            $listed = cargo test --manifest-path egui-app/Cargo.toml $name -- --exact --list
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not ($listed | Where-Object { $_ -eq "${name}: test" })) { throw "Missing mandatory UI regression: $name" }
            cargo test --manifest-path egui-app/Cargo.toml $name -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

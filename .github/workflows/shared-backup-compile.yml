name: Shared Rust backup compile verification
on:
  push:
    branches:
      - refactor/shared-rust-data-access-20261120
    paths:
      - .github/workflows/shared-backup-compile.yml
      - crates/bando-data-access/**
      - egui-app/**
      - src-tauri/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-backup-compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Check Tauri native executable
        run: cargo check --manifest-path src-tauri/Cargo.toml --bin bando_hub_tauri
      - name: Check egui native application
        run: cargo check --manifest-path egui-app/Cargo.toml

# Targeted Rust compilation only (no GUI): egui client and native Tauri CLI, including freight migration.
name: Tauri native CLI executable compile check
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/egui-targeted-check.yml
      - egui-app/src/freight_manager.rs
      - egui-app/src/gateway.rs
      - egui-app/src/main.rs
      - egui-app/src/category_manager.rs
      - egui-app/src/product_manager.rs
      - egui-app/src/catalog_query_bridge.rs
      - egui-app/src/theme.rs
      - src-tauri/src/egui_product_bridge.rs
      - src-tauri/src/business_core/catalog_clients/categories.rs
      - src-tauri/src/egui_shipping_bridge.rs
      - src-tauri/src/main.rs
      - src-tauri/src/lib.rs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: egui-native-targeted-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tauri-cli-windows-check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Compile Tauri executable including egui manual commit CLI dispatch
        run: cargo check --manifest-path src-tauri/Cargo.toml --bin bando_hub_tauri
      - name: Compile standalone egui client-management entrypoint
        run: cargo check --manifest-path egui-app/Cargo.toml
      - name: Verify native category rename, transfer consent and cross-catalog move guard
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib category_ -- --nocapture

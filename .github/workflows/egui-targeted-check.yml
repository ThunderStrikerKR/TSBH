# Targeted compilation and existing isolated checks for the shared Rust data-access path (no GUI).
name: Native Rust data-access and egui targeted check
on:
  # Main pushes use the quick compile gate and scoped checks.
  # Run the complete integrated suite explicitly at a checkpoint.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: egui-native-targeted-${{ github.ref }}
  cancel-in-progress: false
jobs:
  egui-geometry-windows-check:
    name: Isolated egui geometry regression (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: egui-app -> target
          key: egui-geometry
      - name: Verify actual general-screen geometry with isolated synthetic state
        shell: pwsh
        run: |
          $tests = cargo test --manifest-path egui-app/Cargo.toml general_screen_geometry_tests -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests | Write-Output
          $count = @($tests | Where-Object { $_ -match 'general_screen_geometry_tests::.*: test$' }).Count
          if ($count -lt 16) { throw "Expected at least 16 general-screen geometry tests; found $count" }
          cargo test --manifest-path egui-app/Cargo.toml general_screen_geometry_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify window placement persistence and workspace split geometry
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          cargo test --manifest-path egui-app/Cargo.toml window_state:: -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml layout::geometry_contract -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual egui modal boundary rects and 16pt workspace spacing
        shell: pwsh
        if: ${{ !cancelled() }}
        run: |
          $tests = cargo test --manifest-path egui-app/Cargo.toml modal_editor_workspace_geometry_tests -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests | Write-Output
          $count = @($tests | Where-Object { $_ -match 'modal_editor_workspace_geometry_tests::.*: test$' }).Count
          if ($count -lt 1) { throw "No modal geometry regression tests were discovered" }
          cargo test --manifest-path egui-app/Cargo.toml modal_editor_workspace_geometry_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual price write failure, retry and silent completion
        shell: pwsh
        if: ${{ !cancelled() }}
        run: |
          $names = @(
            'product_manager::tests::failed_price_write_keeps_dirty_draft_available_for_retry',
            'product_manager::tests::spreadsheet_price_commits_do_not_show_per_cell_success_popup'
          )
          foreach ($name in $names) {
            $listed = cargo test --manifest-path egui-app/Cargo.toml $name -- --exact --list
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not ($listed | Where-Object { $_ -eq "${name}: test" })) { throw "Missing regression test: $name" }
            cargo test --manifest-path egui-app/Cargo.toml $name -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  native-data-access-windows-check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Compile standalone egui client-management entrypoint
        run: cargo check --manifest-path egui-app/Cargo.toml
      - name: Verify legacy SQLite backup restore, rollback and revision safety
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib backup_manager::tests -- --nocapture
      - name: Verify relational SQLite migration, preserved before-images and ID scoping
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib relational_store::tests -- --nocapture
      - name: Verify unconfirmed draft becomes a locked order only after first-stage approval
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib workflow_sqlite_integration_tests::native_unconfirmed_draft_first_stage_confirmation_commits_as_one_order -- --nocapture
      - name: Verify durable payment copy evidence and changed-account invalidation
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib payment_copy_evidence_survives_sqlite_reopen_and_rejects_changed_account -- --nocapture
      - name: Verify recipient hover uses the production typography context
        run: cargo test --manifest-path egui-app/Cargo.toml recipient_source_reverse_hover_tests -- --nocapture
      - name: Verify pending workflow card uses the production typography context
        run: cargo test --manifest-path egui-app/Cargo.toml pending_matching_tests -- --nocapture
      - name: Verify persisted product price history across SQLite reopen
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib native_product_price_history_cell_detail_reopen_and_stale_guard -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --lib native_product_excel_backup_commit_reopen_and_stale_revision_guard -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify product Excel review status filter and message fallback
        run: cargo test --manifest-path egui-app/Cargo.toml product_excel_ui::tests -- --nocapture
      - name: Verify category map heading contract distinguishes section and subsection headings
        run: cargo test --manifest-path egui-app/Cargo.toml category_manager::modal_layout_contract_tests -- --nocapture
      - name: Verify Excel-style product price cell autosave and draft handling
        run: cargo test --manifest-path egui-app/Cargo.toml product_manager::tests -- --nocapture --skip product_detail_cannot_reintroduce_stacked_fields_or_static_sales_label
      - name: Forbid UI-local monospace fonts outside the central semantic policy
        shell: bash
        run: |
          if git grep -n -E 'FontId::monospace|FontFamily::Monospace|\.monospace\(' -- egui-app/src ':!egui-app/src/typography.rs'; then
            echo "UI-local monospace bypasses typography::data_value_font" >&2
            exit 1
          fi
      - name: Verify audited screens use shared UI components
        run: |
          cargo test --manifest-path egui-app/Cargo.toml shared_ -- --nocapture
          cargo test --manifest-path egui-app/Cargo.toml management_readonly_table_contract_tests -- --nocapture
          cargo test --manifest-path egui-app/Cargo.toml fixed_scroll_panel_contract_tests -- --nocapture
          cargo test --manifest-path egui-app/Cargo.toml management_date_field_contract_tests -- --nocapture
      - name: Verify asynchronous pending, empty and loaded states preserve management geometry
        run: cargo test --manifest-path egui-app/Cargo.toml management_async_layout_contract_tests -- --nocapture
      - name: Verify conditional status and action rows preserve exact egui Rects
        run: cargo test --manifest-path egui-app/Cargo.toml fixed_layout_slot_contract_tests -- --nocapture
      - name: Verify shared action tooltip semantics
        run: cargo test --manifest-path egui-app/Cargo.toml common_action_tooltip_tests -- --nocapture
      - name: Reject state-dependent reception control layout drift over 0.5pt
        run: cargo test --manifest-path egui-app/Cargo.toml reception_state_layout_invariance_tests -- --nocapture
      - name: Reject result list state-dependent geometry drift
        run: cargo test --manifest-path egui-app/Cargo.toml result_viewport_invariance_tests -- --nocapture
      - name: Verify pending-state actions, errors and edit evidence survive async transitions
        run: cargo test --manifest-path egui-app/Cargo.toml management_async_behavior_regression_tests -- --nocapture
      - name: Verify client-tier KPIs distinguish loading and failed reads from true zero counts
        run: cargo test --manifest-path egui-app/Cargo.toml client_async_kpi_tests -- --nocapture
      - name: Verify settings conflict recovery keeps a fixed title and tab geometry
        run: cargo test --manifest-path egui-app/Cargo.toml settings_view::management_async_layout_tests -- --nocapture
      - name: Verify React-compatible four sale states and legacy catalog labels
        run: cargo test --manifest-path egui-app/Cargo.toml four_sales_states_restore_react_values -- --nocapture
      - name: Verify sale status edits persist without changing prices or variant identities
        run: cargo test --manifest-path egui-app/Cargo.toml product_status_edit_persists_without_price_or_variant_loss -- --nocapture
      - name: Verify native Rust catalog editor retains all four sale statuses
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib editor_persists_all_four_sales_states -- --nocapture
      - name: Verify management search re-entry places caret after last query character
        run: cargo test --manifest-path egui-app/Cargo.toml management_search_caret_tests -- --nocapture
      - name: Verify shared money input live commas and caret-safe editing
        run: cargo test --manifest-path egui-app/Cargo.toml money_live_format_tests -- --nocapture
      - name: Verify product details dialog scope, choice and quantity-gated Apply
        run: cargo test --manifest-path egui-app/Cargo.toml item_editor::tests -- --nocapture
      - name: Verify catalog image source, hidden/manual override, and stable native texture identity
        run: cargo test --manifest-path egui-app/Cargo.toml product_images::tests -- --nocapture
      - name: Verify product-row click opens correct modal and blocks dirty edits
        run: cargo test --manifest-path egui-app/Cargo.toml reception_item_editor_integration_tests -- --nocapture
      - name: Verify catalog replacement preserves source and confirmed quantity
        run: cargo test --manifest-path egui-app/Cargo.toml explicit_catalog_replacement_keeps_existing_quantity_and_source -- --nocapture
      - name: Verify linked source hover uses authoritative recipient spans
        run: cargo test --manifest-path egui-app/Cargo.toml source_highlight::tests -- --nocapture
      - name: Verify 72nd-pass reversible hover and committed pending-order selection
        run: cargo test --manifest-path egui-app/Cargo.toml pending_hover_navigation_tests -- --nocapture
      - name: Verify freight projection scope and stale revision fallback
        run: cargo test --manifest-path egui-app/Cargo.toml freight_refresh_includes_split_groups_and_rejects_stale_or_cross_order_scope -- --nocapture
      - name: Verify cross-group evidence selection and preferred shipment identity
        run: cargo test --manifest-path egui-app/Cargo.toml linked_recipient_selection_tests -- --nocapture
      - name: Verify clicked recipient remains selected when linked hover ends
        run: cargo test --manifest-path egui-app/Cargo.toml hover_changes_visible_recipient_without_changing_committed_selection -- --nocapture
      - name: Verify dealer chooser closes on click before native calculation resolves
        run: cargo test --manifest-path egui-app/Cargo.toml client_chooser_async_handoff_tests -- --nocapture
      - name: Verify source autosave delta FIFO, OCR audit coalescing, and final shutdown flush
        run: cargo test --manifest-path egui-app/Cargo.toml source_autosave::source_delta_tests -- --nocapture
      - name: Verify shared reception async admission rejects every conflicting write order
        run: cargo test --manifest-path egui-app/Cargo.toml reception_jobs::tests -- --nocapture
      - name: Verify inline edits persist order-scoped recognition identities and assignment links
        run: cargo test --manifest-path egui-app/Cargo.toml inline_recognition_identity_tests -- --nocapture
      - name: Verify saved manual models scope recipient and item IDs per order
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib manual_model_scopes_rows_and_assignment_targets_per_order -- --nocapture
      - name: Verify reception admission (active cell commit, clipboard OCR, source replacement, draft deletion, workflow and locality)
        run: cargo test --manifest-path egui-app/Cargo.toml reception_workflow_admission_integration_tests -- --nocapture
      - name: Verify saved native quote and recognition survive SQLite restart
        run: cargo test --manifest-path egui-app/Cargo.toml cached_reception_roundtrip_tests -- --nocapture
      - name: Verify cached Rust recognition restores without fresh analysis
        run: cargo test --manifest-path egui-app/Cargo.toml persisted_analysis_restore_tests -- --nocapture
      - name: Verify non-price edits reuse quotes while invoice inputs invalidate
        run: cargo test --manifest-path egui-app/Cargo.toml quote_reuse_tests -- --nocapture
      - name: Verify only actual client/product/freight master changes invalidate stored prices
        run: cargo test --manifest-path egui-app/Cargo.toml pricing_basis::tests -- --nocapture
      - name: Verify dealer reassignment retains native manual-correction rows and links
        run: cargo test --manifest-path egui-app/Cargo.toml native_order_change::manual_rebind_tests -- --nocapture
      - name: Verify shared single-select dropdown coverage and geometry
        run: cargo test --manifest-path egui-app/Cargo.toml management_dropdown_unification_tests -- --nocapture
      - name: Verify hierarchical category path depth, duplicate labels, cycles and applied colors
        run: cargo test --manifest-path egui-app/Cargo.toml category_dropdown::tests -- --nocapture
      - name: Verify editable Rust order lines, manual price overrides and remote freight totals
        run: cargo test --manifest-path egui-app/Cargo.toml pricing::migration_tests -- --nocapture
      - name: Verify complete multi-recipient receipt totals with VAT and doubled freight
        run: cargo test --manifest-path egui-app/Cargo.toml two_recipients_with_complete_freight -- --nocapture
      - name: Verify order-wide VAT atomically updates selected recipients
        run: cargo test --manifest-path egui-app/Cargo.toml order_wide_vat_policy_changes_all_rows -- --nocapture
      - name: Verify editable VAT rate recalculates receipt totals
        run: cargo test --manifest-path egui-app/Cargo.toml seven_point_five_percent_applies_only_to_selected_shipment -- --nocapture
      - name: Verify VAT modal percentage and scope input
        run: cargo test --manifest-path egui-app/Cargo.toml vat_settings_ui_tests -- --nocapture
      - name: Verify recipient freight completes the entire order total automatically
        run: cargo test --manifest-path egui-app/Cargo.toml incomplete_second_recipient -- --nocapture
      - name: Verify automatic message preview cache and exact copy evidence
        run: cargo test --manifest-path egui-app/Cargo.toml automatic_preview_cache_tests -- --nocapture
      - name: Verify incremental native reception quote matches full calculation
        run: cargo test --manifest-path egui-app/Cargo.toml reception_edit_cache_tests -- --nocapture
      - name: Verify native recipient freight is quoted and collected exactly once
        run: cargo test --manifest-path egui-app/Cargo.toml reception_manual_freight -- --nocapture
      - name: Verify submitted edits replay under authoritative SQLite pricing rules
        run: cargo test --manifest-path crates/bando-data-access/Cargo.toml sqlite_replay_keeps_staff_unit_price -- --nocapture
      - name: Verify direct manual drafts restore as source-free reception worksheets
        run: cargo test --manifest-path egui-app/Cargo.toml direct_manual_model_restores_reception_view_without_source_analysis -- --nocapture
      - name: Preserve saved direct-entry drafts when creating the next order
        run: cargo test --manifest-path egui-app/Cargo.toml saved_direct_entry_is_not_reused_as_the_next_new_reception -- --nocapture
      - name: Verify direct manual entry commits without source recognition or evidence
        run: cargo test --manifest-path crates/bando-data-access/Cargo.toml direct_manual_entry_replays_without_fabricating_source_evidence -- --nocapture
      - name: Reject source blocks and assignments in direct manual mode
        run: cargo test --manifest-path crates/bando-data-access/Cargo.toml direct_mode_rejects_fabricated_source_blocks_and_assignments -- --nocapture
      - name: Verify first recognition and revised delivery snapshots persist through draft removal
        run: cargo test --manifest-path egui-app/Cargo.toml reception_edit_audit_tests -- --nocapture
      - name: Verify engine auto-checked islands, review exceptions and base-charge doubling
        run: cargo test --manifest-path egui-app/Cargo.toml remote_delivery::tests -- --nocapture
      - name: Verify engine-provided locality notice and checkbox explanation
        run: cargo test --manifest-path egui-app/Cargo.toml remote_notice_tests -- --nocapture
      - name: Verify workflow checkbox follows the native auto/manual/legacy projection
        run: cargo test --manifest-path egui-app/Cargo.toml native_remote_preview_is_not_replaced -- --nocapture
      - name: Verify manual worksheet locality matches recipient and exact address
        run: cargo test --manifest-path egui-app/Cargo.toml manual_remote_row_tests -- --nocapture

      - name: Verify one-click cell handoff uses the committed Rust values
        run: cargo test --manifest-path egui-app/Cargo.toml inline_single_click_handoff_tests -- --nocapture
      - name: Verify first-click caret position in Hangul and numeric text fields
        run: cargo test --manifest-path egui-app/Cargo.toml inline_first_click_caret_tests -- --nocapture
      - name: Verify inline edits stay inside the original input cell
        run: cargo test --manifest-path egui-app/Cargo.toml inline_editor_is_in_original_cell -- --nocapture
      - name: Verify recipient focus keeps all five input positions and contact font
        run: cargo test --manifest-path egui-app/Cargo.toml recipient_focus_preserves_original_cell_geometry -- --nocapture
      - name: Verify freight focus preserves exact 36pt height and lower spacing
        run: cargo test --manifest-path egui-app/Cargo.toml freight_focus_preserves_amount_height -- --nocapture
      - name: Verify COD selector stays a common dropdown during VAT edits
        run: cargo test --manifest-path egui-app/Cargo.toml reception_cod_selector_tests -- --nocapture
      - name: Verify native recipient freight and remote-area edit validation
        run: cargo test --manifest-path egui-app/Cargo.toml manual_classification::tests -- --nocapture
      - name: Verify working-order plain shipment list rows and product text
        run: cargo test --manifest-path egui-app/Cargo.toml shipment_list_tests -- --nocapture

      - name: Verify floating notice placement at screen edges and caret anchors
        run: cargo test --manifest-path egui-app/Cargo.toml floating_notice::tests -- --nocapture
      - name: Verify shared user-facing error translation
        run: cargo test --manifest-path egui-app/Cargo.toml user_error::tests -- --nocapture
      - name: Verify Excel loading and empty-state text does not shift its table
        run: cargo test --manifest-path egui-app/Cargo.toml excel_manager::table_state_tests -- --nocapture
      - name: Verify rate-management toolbar actions occupy one centered row
        run: cargo test --manifest-path egui-app/Cargo.toml freight_manager::rate_toolbar_tests -- --nocapture
      - name: Verify shared Freight and Excel table-checkbox centered geometry
        run: cargo test --manifest-path egui-app/Cargo.toml components::management_toolbar_geometry_tests::table_checkbox -- --nocapture
      - name: Verify shared concise product-name table header
        run: cargo test --manifest-path egui-app/Cargo.toml components::management_toolbar_geometry_tests::product_name_column_header -- --nocapture
      - name: Verify all repeating table rows including billed totals use Regular
        run: cargo test --manifest-path egui-app/Cargo.toml typography::management_table_type_roles_tests -- --nocapture
      - name: Verify read-only order history date, row expansion and label rules
        run: cargo test --manifest-path egui-app/Cargo.toml order_history_manager::tests -- --nocapture
      - name: Verify daily settlement Seoul date navigation and view-only sort rules
        run: cargo test --manifest-path egui-app/Cargo.toml daily_settlement_manager::tests -- --nocapture
      - name: Verify egui Logen native XLSX serializer uses the original sixteen text columns
        run: cargo test --manifest-path egui-app/Cargo.toml excel_service::tests -- --nocapture
      - name: Verify existing Tauri app-data DB selection remains mode-isolated
        run: |
          cargo test --manifest-path egui-app/Cargo.toml --bin bando-hub-egui business_state:: -- --nocapture
      - name: Verify unified product Excel V2 import-export roundtrip and review approval
        run: |
          cargo test --manifest-path egui-app/Cargo.toml product_excel::tests -- --nocapture

      - name: Verify product Excel backup, SQLite apply, unchanged orders and stale CAS
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib native_product_excel_backup_commit_reopen_and_stale_revision_guard -- --nocapture
      - name: Verify shared UI catalog roots remain read-only in alias category filter
        run: cargo test --manifest-path egui-app/Cargo.toml alias_manager::tests -- --nocapture

      - name: Verify native category rename, transfer consent and cross-catalog move guard
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib category_ -- --nocapture
      - name: Verify native staff model-group validation and representative rules
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib model_groups::tests -- --nocapture
      - name: Verify model-group actual SQLite backup, reopen and stale-editor CAS
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib native_model_group_sqlite_roundtrip_and_stale_editor_conflict -- --nocapture
      - name: Verify native alias collisions and ID-preserving overwrite
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib aliases::tests -- --nocapture
      - name: Verify alias actual SQLite save, correction and stale-revision refusal
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib native_alias_sqlite_save_correction_and_stale_editor_rejection -- --nocapture
      - name: Verify native brand normalization, aliases and reference preservation
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib brands::tests -- --nocapture
      - name: Verify brand SQLite creation, correction, collisions, CAS and reopened state
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib native_brand_sqlite_save_correction_collision_and_reopen -- --nocapture

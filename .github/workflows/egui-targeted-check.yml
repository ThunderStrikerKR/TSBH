# Targeted compilation and existing isolated checks for the shared Rust data-access path (no GUI).
name: Native Rust data-access and egui targeted check
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/egui-targeted-check.yml
      - egui-app/src/freight_manager.rs
      - egui-app/src/order_history_manager.rs
      - egui-app/src/excel_manager.rs
      - egui-app/src/excel_service.rs
      - egui-app/Cargo.toml
      - egui-app/src/daily_settlement_manager.rs
      - src-tauri/src/business_core/rules/history.rs
      - egui-app/src/management_queries.rs
      - egui-app/src/gateway.rs
      - egui-app/src/developer_ui_samples.rs
      - egui-app/src/main.rs
      - egui-app/src/business_state.rs
      - DEV_WINDOWS_EGUI.cmd
      - egui-app/src/category_manager.rs
      - egui-app/src/product_manager.rs
      - egui-app/src/alias_manager.rs
      - egui-app/src/brand_manager.rs
      - src-tauri/src/business_core/catalog_clients/brands.rs
      - src-tauri/src/business_core/catalog_clients/aliases.rs
      - egui-app/src/model_group_manager.rs
      - egui-app/src/settings_store.rs
      - src-tauri/src/business_core/catalog_clients/model_groups.rs
      - egui-app/src/catalog_query_bridge.rs
      - egui-app/src/theme.rs
      - egui-app/src/components.rs
      - crates/bando-data-access/**
      - src-tauri/src/business_core/catalog_clients/categories.rs
      - src-tauri/src/egui_shipping_bridge.rs
      - src-tauri/src/main.rs
      - src-tauri/src/lib.rs
      - src-tauri/src/workflow_sqlite_integration_tests.rs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: egui-native-targeted-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-data-access-windows-check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Compile Tauri executable using the shared in-process Rust data-access crate
        run: cargo check --manifest-path src-tauri/Cargo.toml --bin bando_hub_tauri
      - name: Compile standalone egui client-management entrypoint
        run: cargo check --manifest-path egui-app/Cargo.toml
      - name: Verify shared Freight and Excel table-checkbox centered geometry
        run: cargo test --manifest-path egui-app/Cargo.toml components::management_toolbar_geometry_tests::table_checkbox -- --nocapture
      - name: Verify read-only order history date, row expansion and label rules
        run: cargo test --manifest-path egui-app/Cargo.toml order_history_manager::tests -- --nocapture
      - name: Verify daily settlement Seoul date navigation and view-only sort rules
        run: cargo test --manifest-path egui-app/Cargo.toml daily_settlement_manager::tests -- --nocapture
      - name: Verify egui Logen native XLSX serializer uses the original sixteen text columns
        run: cargo test --manifest-path egui-app/Cargo.toml excel_service::tests -- --nocapture
      - name: Verify synthetic UI samples cover seven management views without changing original catalog
        run: cargo test --manifest-path egui-app/Cargo.toml developer_ui_samples::tests -- --nocapture
      - name: Verify existing Tauri app-data DB selection remains mode-isolated
        run: cargo test --manifest-path egui-app/Cargo.toml auto_database_location_tests -- --nocapture
      - name: Verify egui product-price input conversion and non-mutating category choices
        run: cargo test --manifest-path egui-app/Cargo.toml product_manager::tests -- --nocapture
      - name: Verify unified product Excel V2 import-export roundtrip and review approval
        run: |
          cargo test --manifest-path egui-app/Cargo.toml product_excel::tests -- --nocapture
          cargo test --manifest-path egui-app/Cargo.toml product_excel_ui::tests -- --nocapture
      - name: Verify product Excel backup, SQLite apply, unchanged orders and stale CAS
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib native_product_excel_backup_commit_reopen_and_stale_revision_guard -- --nocapture
      - name: Verify shared UI catalog roots remain read-only in alias category filter
        run: cargo test --manifest-path egui-app/Cargo.toml alias_manager::tests -- --nocapture
      - name: Verify native category rename, transfer consent and cross-catalog move guard
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib category_ -- --nocapture
      - name: Verify native staff model-group validation and representative rules
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib model_groups::tests -- --nocapture
      - name: Verify model-group actual SQLite backup, reopen and stale-editor CAS
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib native_model_group_sqlite_roundtrip_and_stale_editor_conflict -- --nocapture
      - name: Verify native alias collisions and ID-preserving overwrite
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib aliases::tests -- --nocapture
      - name: Verify alias actual SQLite save, correction and stale-revision refusal
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib native_alias_sqlite_save_correction_and_stale_editor_rejection -- --nocapture
      - name: Verify native brand normalization, aliases and reference preservation
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib brands::tests -- --nocapture
      - name: Verify brand SQLite creation, correction, collisions, CAS and reopened state
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib native_brand_sqlite_save_correction_collision_and_reopen -- --nocapture

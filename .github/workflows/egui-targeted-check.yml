# Targeted compilation and existing isolated checks for the shared Rust data-access path (no GUI).
name: Native Rust data-access and egui targeted check
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/egui-targeted-check.yml
      - egui-app/src/freight_manager.rs
      - egui-app/src/order_history_manager.rs
      - egui-app/src/excel_manager.rs
      - egui-app/src/excel_service.rs
      - egui-app/Cargo.toml
      - egui-app/src/daily_settlement_manager.rs
      - src-tauri/src/business_core/rules/history.rs
      - egui-app/src/management_queries.rs
      - egui-app/src/gateway.rs
      - egui-app/src/developer_ui_samples.rs
      - egui-app/src/main.rs
      - egui-app/src/client_chooser.rs
      - egui-app/src/http_gateway.rs
      - egui-app/src/preview_store.rs
      - egui-app/src/reception_service.rs
      - egui-app/src/pricing_basis.rs
      - egui-app/src/native_order_change.rs
      - egui-app/src/workflow_board_ui.rs
      - egui-app/src/manual_workspace.rs
      - src-tauri/src/business_core/rules/pricing.rs
      - egui-app/src/floating_notice.rs
      - egui-app/src/settings_view.rs
      - egui-app/src/client_manager.rs
      - egui-app/src/automatic_message_manager.rs
      - egui-app/src/product_excel_ui.rs
      - egui-app/src/business_state.rs
      - DEV_WINDOWS_EGUI.cmd
      - egui-app/src/category_manager.rs
      - egui-app/src/product_manager.rs
      - egui-app/src/alias_manager.rs
      - egui-app/src/brand_manager.rs
      - src-tauri/src/business_core/catalog_clients/brands.rs
      - src-tauri/src/business_core/catalog_clients/aliases.rs
      - egui-app/src/model_group_manager.rs
      - egui-app/src/settings_store.rs
      - src-tauri/src/business_core/catalog_clients/model_groups.rs
      - egui-app/src/catalog_query_bridge.rs
      - egui-app/src/theme.rs
      - egui-app/src/typography.rs
      - egui-app/src/components.rs
      - crates/bando-data-access/**
      - src-tauri/src/business_core/catalog_clients/categories.rs
      - src-tauri/src/egui_shipping_bridge.rs
      - src-tauri/src/main.rs
      - src-tauri/src/lib.rs
      - src-tauri/src/workflow_sqlite_integration_tests.rs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: egui-native-targeted-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-data-access-windows-check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Compile Tauri executable using the shared in-process Rust data-access crate
        run: cargo check --manifest-path src-tauri/Cargo.toml --bin bando_hub_tauri
      - name: Compile standalone egui client-management entrypoint
        run: cargo check --manifest-path egui-app/Cargo.toml
      - name: Verify dealer chooser closes on click before native calculation resolves
        run: cargo test --manifest-path egui-app/Cargo.toml client_chooser_async_handoff_tests -- --nocapture
      - name: Verify saved native quote and recognition survive SQLite restart
        run: cargo test --manifest-path egui-app/Cargo.toml cached_reception_roundtrip_tests -- --nocapture
      - name: Verify cached Rust recognition restores without fresh analysis
        run: cargo test --manifest-path egui-app/Cargo.toml persisted_analysis_restore_tests -- --nocapture
      - name: Verify non-price edits reuse quotes while invoice inputs invalidate
        run: cargo test --manifest-path egui-app/Cargo.toml quote_reuse_tests -- --nocapture
      - name: Verify only actual client/product/freight master changes invalidate stored prices
        run: cargo test --manifest-path egui-app/Cargo.toml pricing_basis::tests -- --nocapture
      - name: Verify dealer reassignment retains native manual-correction rows and links
        run: cargo test --manifest-path egui-app/Cargo.toml native_order_change::manual_rebind_tests -- --nocapture
      - name: Verify shared single-select dropdown coverage and geometry
        run: cargo test --manifest-path egui-app/Cargo.toml management_dropdown_unification_tests -- --nocapture
      - name: Verify editable Rust order lines, manual price overrides and remote freight totals
        run: cargo test --manifest-path egui-app/Cargo.toml pricing::migration_tests -- --nocapture
      - name: Verify complete multi-recipient receipt totals with VAT and doubled freight
        run: cargo test --manifest-path egui-app/Cargo.toml two_recipients_with_complete_freight -- --nocapture
      - name: Verify order-wide VAT atomically updates selected recipients
        run: cargo test --manifest-path egui-app/Cargo.toml order_wide_vat_policy_changes_all_rows -- --nocapture
      - name: Verify editable VAT rate recalculates receipt totals
        run: cargo test --manifest-path egui-app/Cargo.toml seven_point_five_percent_applies_only_to_selected_shipment -- --nocapture
      - name: Verify VAT modal percentage and scope input
        run: cargo test --manifest-path egui-app/Cargo.toml vat_settings_ui_tests -- --nocapture
      - name: Verify recipient freight completes the entire order total automatically
        run: cargo test --manifest-path egui-app/Cargo.toml incomplete_second_recipient -- --nocapture
      - name: Verify native recipient freight is quoted and collected exactly once
        run: cargo test --manifest-path egui-app/Cargo.toml reception_manual_freight -- --nocapture
      - name: Verify submitted edits replay under authoritative SQLite pricing rules
        run: cargo test --manifest-path crates/bando-data-access/Cargo.toml sqlite_replay_keeps_staff_unit_price -- --nocapture
      - name: Verify first recognition and revised delivery snapshots persist through draft removal
        run: cargo test --manifest-path egui-app/Cargo.toml reception_edit_audit_tests -- --nocapture
      - name: Verify engine auto-checked islands, review exceptions and base-charge doubling
        run: cargo test --manifest-path egui-app/Cargo.toml remote_delivery::tests -- --nocapture
      - name: Verify engine-provided locality notice and checkbox explanation
        run: cargo test --manifest-path egui-app/Cargo.toml remote_notice_tests -- --nocapture
      - name: Verify workflow checkbox follows the native auto/manual/legacy projection
        run: cargo test --manifest-path egui-app/Cargo.toml native_remote_preview_is_not_replaced -- --nocapture
      - name: Verify manual worksheet locality matches recipient and exact address
        run: cargo test --manifest-path egui-app/Cargo.toml manual_remote_row_tests -- --nocapture
      - name: Verify reverse recipient source hover and I-beam cursor on all five fields
        run: cargo test --manifest-path egui-app/Cargo.toml recipient_source_reverse_hover_tests -- --nocapture
      - name: Verify one-click cell handoff uses the committed Rust values
        run: cargo test --manifest-path egui-app/Cargo.toml inline_single_click_handoff_tests -- --nocapture
      - name: Verify first-click caret position in Hangul and numeric text fields
        run: cargo test --manifest-path egui-app/Cargo.toml inline_first_click_caret_tests -- --nocapture
      - name: Verify inline edits stay inside the original input cell
        run: cargo test --manifest-path egui-app/Cargo.toml inline_editor_is_in_original_cell -- --nocapture
      - name: Verify recipient focus keeps all five input positions and contact font
        run: cargo test --manifest-path egui-app/Cargo.toml recipient_focus_preserves_original_cell_geometry -- --nocapture
      - name: Verify freight focus preserves exact 36pt height and lower spacing
        run: cargo test --manifest-path egui-app/Cargo.toml freight_focus_preserves_amount_height -- --nocapture
      - name: Verify COD selector stays a common dropdown during VAT edits
        run: cargo test --manifest-path egui-app/Cargo.toml reception_cod_selector_tests -- --nocapture
      - name: Verify native recipient freight and remote-area edit validation
        run: cargo test --manifest-path egui-app/Cargo.toml manual_classification::tests -- --nocapture
      - name: Verify working-order plain shipment list rows and product text
        run: cargo test --manifest-path egui-app/Cargo.toml shipment_list_tests -- --nocapture
      - name: Verify unconfirmed receipts have no dealer-confirmation stage button
        run: cargo test --manifest-path egui-app/Cargo.toml pending_matching_tests -- --nocapture
      - name: Verify floating notice placement at screen edges and caret anchors
        run: cargo test --manifest-path egui-app/Cargo.toml floating_notice::tests -- --nocapture
      - name: Verify Excel loading and empty-state text does not shift its table
        run: cargo test --manifest-path egui-app/Cargo.toml excel_manager::table_state_tests -- --nocapture
      - name: Verify rate-management toolbar actions occupy one centered row
        run: cargo test --manifest-path egui-app/Cargo.toml freight_manager::rate_toolbar_tests -- --nocapture
      - name: Verify shared Freight and Excel table-checkbox centered geometry
        run: cargo test --manifest-path egui-app/Cargo.toml components::management_toolbar_geometry_tests::table_checkbox -- --nocapture
      - name: Verify shared concise product-name table header
        run: cargo test --manifest-path egui-app/Cargo.toml components::management_toolbar_geometry_tests::product_name_column_header -- --nocapture
      - name: Verify all repeating table rows including billed totals use Regular
        run: cargo test --manifest-path egui-app/Cargo.toml typography::management_table_type_roles_tests -- --nocapture
      - name: Verify read-only order history date, row expansion and label rules
        run: cargo test --manifest-path egui-app/Cargo.toml order_history_manager::tests -- --nocapture
      - name: Verify daily settlement Seoul date navigation and view-only sort rules
        run: cargo test --manifest-path egui-app/Cargo.toml daily_settlement_manager::tests -- --nocapture
      - name: Verify egui Logen native XLSX serializer uses the original sixteen text columns
        run: cargo test --manifest-path egui-app/Cargo.toml excel_service::tests -- --nocapture
      - name: Verify synthetic UI samples cover seven management views without changing original catalog
        run: cargo test --manifest-path egui-app/Cargo.toml developer_ui_samples::tests -- --nocapture
      - name: Verify existing Tauri app-data DB selection remains mode-isolated
        run: cargo test --manifest-path egui-app/Cargo.toml auto_database_location_tests -- --nocapture
      - name: Verify egui product-price input conversion and non-mutating category choices
        run: cargo test --manifest-path egui-app/Cargo.toml product_manager::tests -- --nocapture
      - name: Verify unified product Excel V2 import-export roundtrip and review approval
        run: |
          cargo test --manifest-path egui-app/Cargo.toml product_excel::tests -- --nocapture
          cargo test --manifest-path egui-app/Cargo.toml product_excel_ui::tests -- --nocapture
      - name: Verify product Excel backup, SQLite apply, unchanged orders and stale CAS
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib native_product_excel_backup_commit_reopen_and_stale_revision_guard -- --nocapture
      - name: Verify shared UI catalog roots remain read-only in alias category filter
        run: cargo test --manifest-path egui-app/Cargo.toml alias_manager::tests -- --nocapture
      - name: Verify native category rename, transfer consent and cross-catalog move guard
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib category_ -- --nocapture
      - name: Verify native staff model-group validation and representative rules
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib model_groups::tests -- --nocapture
      - name: Verify model-group actual SQLite backup, reopen and stale-editor CAS
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib native_model_group_sqlite_roundtrip_and_stale_editor_conflict -- --nocapture
      - name: Verify native alias collisions and ID-preserving overwrite
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib aliases::tests -- --nocapture
      - name: Verify alias actual SQLite save, correction and stale-revision refusal
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib native_alias_sqlite_save_correction_and_stale_editor_rejection -- --nocapture
      - name: Verify native brand normalization, aliases and reference preservation
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib brands::tests -- --nocapture
      - name: Verify brand SQLite creation, correction, collisions, CAS and reopened state
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib native_brand_sqlite_save_correction_collision_and_reopen -- --nocapture

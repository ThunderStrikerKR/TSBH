name: Native egui interaction, management and workflow regression
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/egui-manual-classification-check.yml
      - egui-app/src/manual_workspace.rs
      - egui-app/src/manual_product_search.rs
      - egui-app/src/product_manager.rs
      - egui-app/src/item_editor.rs
      - egui-app/src/pricing_basis.rs
      - 'src-tauri/src/business_core/**'
      - 'crates/bando-data-access/**'
      - '.github/workflows/workflow-performance.yml'
      - egui-app/src/manual_source_view.rs
      - egui-app/src/source_highlight.rs
      - egui-app/src/one_touch.rs
      - 'egui-app/src/**'
      - egui-app/src/main.rs
      - egui-app/src/theme.rs
      - egui-app/src/typography.rs
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/egui-manual-classification-check.yml
      - egui-app/src/manual_workspace.rs
      - egui-app/src/manual_product_search.rs
      - egui-app/src/product_manager.rs
      - egui-app/src/item_editor.rs
      - egui-app/src/pricing_basis.rs
      - 'src-tauri/src/business_core/**'
      - 'crates/bando-data-access/**'
      - '.github/workflows/workflow-performance.yml'
      - egui-app/src/manual_source_view.rs
      - egui-app/src/source_highlight.rs
      - egui-app/src/one_touch.rs
      - 'egui-app/src/**'
      - egui-app/src/main.rs
      - egui-app/src/theme.rs
      - egui-app/src/typography.rs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: egui-manual-classification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  manual-classification:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: egui-app -> target
      # cargo test compiles the current application; the independent quick compile gate remains.
      - name: Verify inline editing persists order-scoped recognition IDs and assignment links
        run: cargo test --manifest-path egui-app/Cargo.toml inline_recognition_identity_tests -- --nocapture
      - name: Verify order confirmation commits the active cell before resuming
        run: cargo test --manifest-path egui-app/Cargo.toml reception_workflow_admission_integration_tests -- --nocapture
      - name: Verify source autosave deletion acknowledgement and stale snapshot protection
        run: cargo test --manifest-path egui-app/Cargo.toml source_delta_tests -- --nocapture
      - name: Verify durable recognition correction evidence and legacy audit migration
        run: cargo test --manifest-path egui-app/Cargo.toml reception_edit_audit_tests -- --nocapture
      - name: Verify source-grounded correction candidate extraction
        run: cargo test --manifest-path egui-app/Cargo.toml recognition::corrections::tests -- --nocapture
      - name: Verify immutable first-recognition handoff and observation comparison
        run: |
          cargo test --manifest-path egui-app/Cargo.toml dealer_selection_without_manual_edits_uses_complete_native_quote -- --nocapture
          cargo test --manifest-path egui-app/Cargo.toml recognition::observations::tests -- --nocapture
          cargo test --manifest-path egui-app/Cargo.toml recognition::learning_context::tests -- --nocapture
          cargo test --manifest-path egui-app/Cargo.toml owner_trace_ -- --nocapture
          cargo test --manifest-path egui-app/Cargo.toml owner_snapshot_batch_reads_only_requested_frozen_snapshots -- --nocapture
      - name: Verify content-fitted manual popup and Reception source-pane geometry
        run: cargo test --manifest-path egui-app/Cargo.toml manual_workspace_layout_tests -- --nocapture
      - name: Verify the unified date-selector count control geometry and single-recipient 1/1 header
        run: cargo test --manifest-path egui-app/Cargo.toml date_navigation_segmented_control_tests -- --nocapture
      - name: Verify recipient arrows alone disable while the 1/N label remains visible
        run: cargo test --manifest-path egui-app/Cargo.toml reception_recipient_navigation_state_tests -- --nocapture
      - name: Verify manual shipment count uses one segmented control and preserves resize flow
        run: cargo test --manifest-path egui-app/Cargo.toml shipment_count_is_one_date_selector_segmented_control -- --nocapture
      - name: Verify direct input shares the manual worksheet without source evidence
        run: cargo test --manifest-path egui-app/Cargo.toml direct_input_workspace_tests -- --nocapture
      - name: Verify intake and manual share the current editable worksheet master
        run: cargo test --manifest-path egui-app/Cargo.toml manual_cards_reuse_the_real_reception_renderers -- --nocapture
      - name: Verify live money cell and quantity stepper contracts
        run: |
          cargo test --manifest-path egui-app/Cargo.toml money_live_format_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml reception_quantity_step_keeps_unit_out_of_native_draft_and_respects_bounds -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify nested modal input routing
        run: cargo test --manifest-path egui-app/Cargo.toml modal_input_routing_tests -- --nocapture
      - name: Reproduce modal pointer clicks and shared linked-cell blue emphasis
        run: cargo test --manifest-path egui-app/Cargo.toml manual_nested_prompt_regression_tests -- --nocapture
      - name: Verify manual modal routing and Escape behavior
        run: cargo test --manifest-path egui-app/Cargo.toml manual_workspace_modal_routing_tests -- --nocapture
      - name: Verify React-equivalent pending quantity guards
        run: cargo test --manifest-path egui-app/Cargo.toml manual_pending_interaction_tests -- --nocapture
      - name: Verify manual source ownership and Unicode hit testing
        run: cargo test --manifest-path egui-app/Cargo.toml manual_span_projection_tests -- --nocapture
      - name: Verify both click orders and drag share native assignment validation
        run: cargo test --manifest-path egui-app/Cargo.toml manual_assignment_gesture_tests -- --nocapture
      - name: Verify shared product click routing and manual draft detail policy
        run: |
          cargo test --manifest-path egui-app/Cargo.toml item_editor::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml reception_item_editor_integration_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify freight inquiry visibility preserves checkbox geometry
        run: cargo test --manifest-path egui-app/Cargo.toml reception_cod_selector_tests -- --nocapture
      - name: Verify shared button blue hover and keyboard focus palette
        run: cargo test --manifest-path egui-app/Cargo.toml shared_action_style_tests -- --nocapture
      - name: Verify one-touch message typography, hover geometry and shared palette
        run: cargo test --manifest-path egui-app/Cargo.toml one_touch::tests -- --nocapture
      - name: Verify manual arrow navigation follows visible worksheet rows
        run: cargo test --manifest-path egui-app/Cargo.toml arrows_move_to_visible_adjacent_cells_not_text_caret_positions -- --nocapture
      - name: Verify arrow interception happens before TextEdit and preserves Korean IME
        run: cargo test --manifest-path egui-app/Cargo.toml arrow_navigation_is_captured_before_text_edit_and_ime_is_respected -- --nocapture
      - name: Verify manual quantity, address and quote behavior
        run: cargo test --manifest-path egui-app/Cargo.toml manual_remote_row_tests -- --nocapture
      - name: Verify client preferred-account options and stored selection semantics
        run: cargo test --manifest-path egui-app/Cargo.toml client_account_picker_tests -- --nocapture
      - name: Verify search-tag add, duplicate prevention and individual removal
        run: cargo test --manifest-path egui-app/Cargo.toml client_search_tags::tests -- --nocapture
      - name: Verify the same header and row column-divider positions
        run: cargo test --manifest-path egui-app/Cargo.toml management_client_column_divider_tests -- --nocapture
      - name: Category navigation and common breadcrumb geometry
        run: cargo test --manifest-path egui-app/Cargo.toml category_dropdown::tests -- --nocapture
      - name: Category management layout and navigation
        run: |
          cargo test --manifest-path egui-app/Cargo.toml category_manager:: -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Model group registry and editor
        run: |
          cargo test --manifest-path egui-app/Cargo.toml model_group_manager:: -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Brand modal lifecycle
        run: cargo test --manifest-path egui-app/Cargo.toml brand_manager::modal_lifecycle_tests -- --nocapture
      - name: Alias registry, picker and editor
        run: |
          cargo test --manifest-path egui-app/Cargo.toml alias_manager:: -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Shared table renderer geometry
        run: cargo test --manifest-path egui-app/Cargo.toml table::regression_tests -- --nocapture
      - name: Compile egui and verify admission and scope contracts
        shell: pwsh
        run: |
          cargo test --manifest-path egui-app/Cargo.toml compact_virtualization_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml shipment_list_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml workflow_freight_typography_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml reception_product_ellipsis_respects_width_and_korean_boundaries -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml quote_identity_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml recognition_learning_store_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml learning_raw_ -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml learning_lifecycle_excludes_cancelled_deleted_and_partial_orders -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml recognition_learning_lifecycle_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml cell_navigation:: -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml source_highlight:: -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml manual_source_view:: -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml manual_render_cache_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml pending_display_cache_reuses_exact_projection_and_rejects_edited_receipt -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml review_panel:: -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml clipboard_intake:: -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml kakao_context:: -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml periodic_workflow_read_is_advisory_but_post_commit_refresh_is_mandatory -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml reception_metadata_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml shared_reception_metadata_keeps_cached_values_on_unchanged_revision -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml unchanged_workflow_revision_keeps_current_snapshot_and_selection -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml failed_delivery_command_never_restores_a_hidden_editor -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml reception_jobs::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml freight_refresh_includes_split_groups_and_rejects_stale_or_cross_order_scope -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml reception_edit_cache_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml reception_freight_reset_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml reanalysis_keeps_explicit_prices_and_freight_for_same_product -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml dealer_change_preserves_manual_amounts_and_refreshes_automatic_prices -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml manual_amount_priority_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml manual_price_retention_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml workflow_freight_edit_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path crates/bando-data-access/Cargo.toml client_entity_cas_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path crates/bando-data-access/Cargo.toml management_scope_cas_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path crates/bando-data-access/Cargo.toml workbook_exact_delta_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml unified_v2_roundtrip_keeps_identity_and_prices -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path crates/bando-data-access/Cargo.toml freight_billing_reasons_distinguish_exempt_missing_collect_and_zero -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path crates/bando-data-access/Cargo.toml missing_prepaid_freight_is_a_structured_stage_two_issue -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path crates/bando-data-access/Cargo.toml shared_vat_rule_matches_reported_order_and_preserves_explicit_overrides -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path crates/bando-data-access/Cargo.toml dealer_vat_default_is_shared_by_cached_and_full_reception -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml title_ambiguity_regressions -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path crates/bando-data-access/Cargo.toml undo_approval_history_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path egui-app/Cargo.toml automatic_preview_cache_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

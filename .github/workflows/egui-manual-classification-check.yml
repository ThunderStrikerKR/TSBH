name: Manual classification modal and linked-source checks
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/egui-manual-classification-check.yml
      - egui-app/src/manual_workspace.rs
      - egui-app/src/manual_product_search.rs
      - egui-app/src/product_manager.rs
      - egui-app/src/item_editor.rs
      - egui-app/src/pricing_basis.rs
      - src-tauri/src/business_core/rules/**
      - egui-app/src/manual_source_view.rs
      - egui-app/src/source_highlight.rs
      - egui-app/src/components.rs
      - egui-app/src/main.rs
      - egui-app/src/theme.rs
      - egui-app/src/typography.rs
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/egui-manual-classification-check.yml
      - egui-app/src/manual_workspace.rs
      - egui-app/src/manual_product_search.rs
      - egui-app/src/product_manager.rs
      - egui-app/src/item_editor.rs
      - egui-app/src/pricing_basis.rs
      - src-tauri/src/business_core/rules/**
      - egui-app/src/manual_source_view.rs
      - egui-app/src/source_highlight.rs
      - egui-app/src/components.rs
      - egui-app/src/main.rs
      - egui-app/src/theme.rs
      - egui-app/src/typography.rs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: egui-manual-classification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  manual-classification:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: egui-app -> target
      - name: Compile the native egui workspace
        run: cargo check --manifest-path egui-app/Cargo.toml
      - name: Verify content-fitted manual popup and Reception source-pane geometry
        run: cargo test --manifest-path egui-app/Cargo.toml manual_workspace_layout_tests -- --nocapture
      - name: Verify the unified date-selector count control geometry and single-recipient 1/1 header
        run: cargo test --manifest-path egui-app/Cargo.toml date_navigation_segmented_control_tests -- --nocapture
      - name: Verify recipient arrows alone disable while the 1/N label remains visible
        run: cargo test --manifest-path egui-app/Cargo.toml reception_recipient_navigation_state_tests -- --nocapture
      - name: Verify manual shipment count uses one segmented control and preserves resize flow
        run: cargo test --manifest-path egui-app/Cargo.toml shipment_count_is_one_date_selector_segmented_control -- --nocapture
      - name: Verify intake and manual share the current editable worksheet master
        run: cargo test --manifest-path egui-app/Cargo.toml manual_cards_reuse_the_real_reception_renderers -- --nocapture
      - name: Verify live money cell and quantity stepper contracts
        run: |
          cargo test --manifest-path egui-app/Cargo.toml money_live_format_tests -- --nocapture
          cargo test --manifest-path egui-app/Cargo.toml reception_quantity_step_keeps_unit_out_of_native_draft_and_respects_bounds -- --nocapture
      - name: Verify nested modal input routing
        run: cargo test --manifest-path egui-app/Cargo.toml modal_input_routing_tests -- --nocapture
      - name: Verify manual modal routing and Escape behavior
        run: cargo test --manifest-path egui-app/Cargo.toml manual_workspace_modal_routing_tests -- --nocapture
      - name: Verify React-equivalent pending quantity guards
        run: cargo test --manifest-path egui-app/Cargo.toml manual_pending_interaction_tests -- --nocapture
      - name: Verify manual source ownership and Unicode hit testing
        run: cargo test --manifest-path egui-app/Cargo.toml manual_span_projection_tests -- --nocapture
      - name: Verify manual source click and drag identity
        run: cargo test --manifest-path egui-app/Cargo.toml manual_source_view::tests -- --nocapture
      - name: Verify both click orders and drag share native assignment validation
        run: cargo test --manifest-path egui-app/Cargo.toml manual_assignment_gesture_tests -- --nocapture
      - name: Verify shared product click routing and manual draft detail policy
        run: |
          cargo test --manifest-path egui-app/Cargo.toml item_editor::tests -- --nocapture
          cargo test --manifest-path egui-app/Cargo.toml reception_item_editor_integration_tests -- --nocapture
      - name: Verify existing reception source highlighting remains stable
        run: cargo test --manifest-path egui-app/Cargo.toml source_highlight::tests -- --nocapture
      - name: Verify manual arrow navigation follows visible worksheet rows
        run: cargo test --manifest-path egui-app/Cargo.toml arrows_move_to_visible_adjacent_cells_not_text_caret_positions -- --nocapture
      - name: Verify arrow interception happens before TextEdit and preserves Korean IME
        run: cargo test --manifest-path egui-app/Cargo.toml arrow_navigation_is_captured_before_text_edit_and_ime_is_respected -- --nocapture
      - name: Verify manual quantity, address and quote behavior
        run: cargo test --manifest-path egui-app/Cargo.toml manual_remote_row_tests -- --nocapture

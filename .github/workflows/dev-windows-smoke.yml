name: TSBH Windows DEV mode smoke

concurrency:
  group: bando-dev-windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  # Always run the isolated real Windows Tauri/WebView2 workflow when
  # the verification definition changes on main; this exercises the latest
  # merged source instead of an obsolete PR revision.
  push:
    branches:
      - main
    paths:
      - DEV_WINDOWS_TAURI.cmd
      - scripts/ensure-node-deps.ps1
      - .github/workflows/dev-windows-smoke.yml
      - scripts/migration32-dev-windows-smoke.ps1
      - scripts/verify-dev-window-placement-win.ps1
      - scripts/migration32-dev-business-ui.mjs
      - scripts/ci-dev-domain-gui.mjs
      - scripts/migration31-real-two-orders.mjs
      - scripts/migration32-real-factory-notifications.mjs
      - scripts/migration32-real-ocr-cancel.mjs
      - src/SourceDocument.tsx
      - src/App.tsx
      - src/app/useAppModel.ts
      - src/shared/useEventCallback.ts
      - src/HubWorkspace.tsx
      - src/main.tsx
      - src/perf-audit.ts
      - src/perf-audit-profiler.tsx
      - src/tauri-bridge.ts
      - src/shared/native-read-coalescing.ts
      - src/orders/useNativeWorkflowReconcile.ts
      - src/OrderDesk.tsx
      - src/orders/useNativeOrderPreview.ts
      - src/orders/useOrderDesk.tsx
      - src-tauri/src/lib.rs
      - tests/tauri-window-placement.test.mjs
      - tests/dev-window-placement-real-restart.test.mjs
      - tests/ci-windows-smoke-routing.test.mjs
      - tests/ci-dev-domain-gui-contract.test.mjs
      - scripts/classify-dev-windows-smoke.mjs
      - src-tauri/src/business_core/rules/reception_merge.rs
      - src-tauri/src/business_core/rules/pricing.rs
      - src-tauri/src/business_core/rules/shipping.rs
      - src-tauri/src/business_core/recognition/mod.rs
      - src-tauri/src/business_core/catalog_clients/title_clients.rs
  pull_request:
    branches:
      - main
    paths:
      - DEV_WINDOWS_TAURI.cmd
      - scripts/migration32-dev-windows-smoke.ps1
      - scripts/verify-dev-window-placement-win.ps1
      - .github/workflows/dev-windows-smoke.yml
  workflow_dispatch:
    inputs:
      scope:
        description: 'full/window or a single isolated Windows business domain'
        required: true
        type: choice
        default: full
        options:
          - full
          - window
          - orders
          - pricing
          - shipping
          - clients
          - factory

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fast window and CI routing regression tests
        run: node --test tests/tauri-window-placement.test.mjs tests/dev-window-placement-real-restart.test.mjs tests/ci-windows-smoke-routing.test.mjs tests/ci-dev-domain-gui-contract.test.mjs
      - name: Select smallest safe real Windows scope
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
          CI_HEAD_SHA: ${{ github.sha }}
          CI_OVERRIDE_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || '' }}
        run: node scripts/classify-dev-windows-smoke.mjs

  windows-dev-smoke:
    needs: plan
    if: needs.plan.outputs.scope != 'fast'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # The DEV launcher owns fingerprint-guarded npm ci. Install Playwright
      # only for full GUI mode, after the native app is already running.
      - name: Run actual DEV Tauri business workflows in Windows WebView2
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/migration32-dev-windows-smoke.ps1 -Scope "${{ needs.plan.outputs.scope }}"
      - name: Preserve Windows development app logs, native window screenshot and TEST DB report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TSBH-DEV-Windows-TEST-evidence
          path: dev-windows-smoke-evidence/
          retention-days: 7
          if-no-files-found: warn

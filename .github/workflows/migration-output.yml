name: Rust output migration isolation
on:
  push:
    branches:
      # main is the authoritative post-integration development baseline.
      - main
      - migration/03-integration
      - migration/26-p1-p2-runtime-closure
      - migration/27-unified-rust
      - migration/28-ts-runtime-closure
      - migration/28-reception-manual-rust
      - migration/28-order-edit-rules-rust
      # Former integration branch kept temporarily as a rollback reference.
      - integration/final-rust-migration-20261116
      - migration/05-factory-reply
      - integration/06-history-settlement
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # P1/P2 exact-EXE gate is isolated from long-running older branch attempts.
  # All ordinary migration branches retain their original cancellation group.
  group: ${{ github.ref_name == 'migration/27-unified-rust' && format('rust-output-gate4-{0}', github.ref) || format('rust-output-migration03-{0}', github.ref) }}
  cancel-in-progress: true
jobs:
  output-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and run independent Rust output tests
        run: cargo test --manifest-path tests/rust-migration/output/Cargo.toml
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify TypeScript and production bundle
        run: npm run build
      - name: Inspect frontend source maps and residual business-core markers
        run: node tests/rust-migration/output/audit-bundle.mjs
      - name: Existing frontend regressions
        run: npm test
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Compile actual Tauri Rust and SQLite tests on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  windows-p1p2-real-exe:
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'migration/27-unified-rust' || github.ref_name == 'migration/03-integration' || github.ref_name == 'migration/28-ts-runtime-closure' || github.ref_name == 'migration/28-reception-manual-rust' || github.ref_name == 'migration/28-order-edit-rules-rust' || github.ref_name == 'integration/final-rust-migration-20261116'
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend build dependencies
        run: npm install --no-audit --no-fund
      - name: Build real Windows EXE with CI-only WebView2 CDP config
        # Same business source as production; UI audit hooks are Vite-gated.
        # Production tauri.conf.json never enables WebView2 remote debugging.
        env:
          VITE_BANDO_NATIVE_AUDIT: "true"
        run: npm run build:windows -- --config src-tauri/tauri.ci-cdp.conf.json
      - name: Stage exact Windows binary and record SHA256
        shell: pwsh
        run: |
          $dir="src-tauri/target/release"
          $original=Join-Path $dir "bando_hub_tauri.exe"
          if(!(Test-Path $original)){throw "Native EXE was not built"}
          Copy-Item $original (Join-Path $dir "bando_hub.exe")
          $digest=(Get-FileHash (Join-Path $dir "bando_hub.exe") -Algorithm SHA256).Hash
          Write-Host "Exact CI EXE SHA256: $digest"
          "$digest  bando_hub.exe" | Set-Content -Path (Join-Path $dir "bando_hub.exe.sha256") -Encoding Ascii
      - name: Install WebView2 inspection client (not browser emulator)
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.1
      # CI-only Tauri config passes browser args directly to WebView2.
      # Wry's default options bypass environment/registry CDP overrides.
      - name: Boot real EXE, test isolated SQLite and native UI with actual Rust IPC
        env:
          BANDO_NATIVE_EXE: ${{ github.workspace }}\\src-tauri\\target\\release\\bando_hub.exe
          BANDO_NATIVE_OUT: native-p1p2-evidence
          BANDO_NATIVE_BIN_COMMIT: ${{ github.sha }}
          BANDO_P1P2_AUDIT: "true"
        run: node scripts/migration03-reception-native-ui.mjs
      - name: Publish exact-HEAD CI-only EXE for isolated client persistence audit
        if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'integration/final-rust-migration-20261116'
        uses: actions/upload-artifact@v4
        with:
          name: tsbh-final-rust-exact-head-ci-exe
          path: |
            src-tauri/target/release/bando_hub.exe
            src-tauri/target/release/bando_hub.exe.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Preserve real EXE screenshot, native IPC and SQLite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P1P2-real-Windows-Tauri-EXE-evidence
          path: native-p1p2-evidence/
          if-no-files-found: warn
          retention-days: 7

  output-ts-rust-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install TypeScript oracle dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Compare TypeScript oracle with real Rust engine
        run: node --test tests/rust-migration/output/parity.test.mjs
      - name: Compare real customer-facing payment text with Rust
        run: node --test tests/rust-migration/output/payment-parity.test.mjs
      - name: Compare original automatic inquiry phase with Rust
        run: node --test tests/rust-migration/output/automatic-request-parity.test.mjs
      - name: Compare full automatic messages and legacy payment copy signatures
        run: node --test tests/rust-migration/output/full-automatic-parity.test.mjs
      - name: Compare customer-visible correction text
        run: node --test tests/rust-migration/output/correction-parity.test.mjs
      - name: Compare Kakao title-client mapping
        run: node --test tests/rust-migration/catalog-clients/title-clients-parity.test.mjs
      - name: Compare commit-time billing snapshots
        run: node --test tests/rust-migration/rules/billing-commit-parity.test.mjs
      - name: Compare manually classified orders
        run: node --test tests/rust-migration/rules/manual-apply-parity.test.mjs
      - name: Compare factory review projection
        run: node --test tests/rust-migration/output/factory-review-parity.test.mjs
      - name: Compare Rust freight-read projection
        run: node --test tests/rust-migration/rules/shipping-read-parity.test.mjs
      - name: Compare existing TypeScript price and freight with staged Rust rules
        run: node --test tests/rust-migration/rules/parity.test.mjs

  order-save-ts-rust-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install original TypeScript oracle
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify actual native save-order state transitions against TypeScript
        run: node --test tests/rust-migration/rules/order-save-parity.test.mjs
      - name: Compare native group shipping rates with original TypeScript
        run: node --test tests/rust-migration/rules/shipping-rate-parity.test.mjs
      - name: Compare live native staff review with original TypeScript order issues
        run: node --test tests/rust-migration/rules/preview-issues-parity.test.mjs

  rules-comprehensive-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install TypeScript oracle dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Compare full latest TypeScript rules against actual compiled Rust
        run: npx tsx tests/rust-migration/rules/parity/compare.mts

  integrated-rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Execute actual three-domain Rust dispatcher tests
        run: cargo test --manifest-path tests/rust-migration/integration/Cargo.toml -- --nocapture

  react-native-reception:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install TypeScript dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Real native Rust recognition to React draft parity and preservation
        run: node --test tests/rust-migration/recognition/react-reception.test.mjs
      - name: Original TS order edit, selected dealer and freight vs native Rust
        run: node --test tests/rust-migration/rules/order-edit-native-parity.test.mjs

  factory-reply-ts-rust-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install original TypeScript oracle dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Compare original Excel parser and matching to compiled Rust
        run: node --test tests/rust-migration/factory-reply/parity.test.mjs
      - name: Verify existing manual and automatic Logen XLSX scenarios
        run: node --test tests/tauri-factory-reply-import.test.mjs tests/tauri-factory-reply-auto.test.mjs

  factory-reply-native-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Exercise factory reply parser, automatic SQLite commit and conflict approval on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib factory_ -- --test-threads=1

  history-ts-rust-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install original TypeScript history oracle
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Compare original TS order history and settlement to compiled Rust
        run: node --test tests/rust-migration/rules/history-parity.test.mjs

  # Run the existing real Windows UIA flow on the *same compiled EXE*, on a
  # separate disposable Windows runner. This cannot accidentally read or write
  # a developer's production SQLite database.
  windows-client-registration-persistence:
    name: Real Windows client registration, SQLite save and EXE relaunch
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'integration/final-rust-migration-20261116'
    needs: windows-p1p2-real-exe
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Provision Python sqlite3 for independent relational-row assertions
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate SQL audit helper syntax
        run: python -m py_compile scripts/assert-client-core-row.py
      - name: Retrieve identical CI-only Windows binary
        uses: actions/download-artifact@v4
        with:
          name: tsbh-final-rust-exact-head-ci-exe
          path: native-exe
      - name: Reject a changed or missing native executable
        shell: pwsh
        run: |
          $exe = "native-exe/bando_hub.exe"
          $digest = "native-exe/bando_hub.exe.sha256"
          if (!(Test-Path $exe) -or !(Test-Path $digest)) { throw "CI native EXE or checksum missing" }
          $expected = ((Get-Content $digest -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw "EXE SHA256 mismatch between native UI and client persistence audits" }
          Write-Host "Exact-HEAD Windows EXE SHA256: $actual"
      - name: Real keyboard input, Rust upsert, TEST SQLite persistence and app restart
        shell: pwsh
        env:
          BANDO_BINARY_COMMIT: ${{ github.sha }}
        run: |
          pwsh -NoProfile -Sta -ExecutionPolicy Bypass -File scripts/migration03-client-registration-native-uia.ps1 -Exe (Resolve-Path "native-exe/bando_hub.exe") -OutDir "native-client-evidence"
      - name: Preserve original screenshots and SQLite evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsbh-final-rust-native-client-persistence
          path: native-client-evidence/
          if-no-files-found: warn
          retention-days: 7

  # Reuse the exact same CI Windows EXE artifact. Navigation and modal
  # assertions use actual WebView2/CDP, not a browser-only React mock.
  windows-all-menus-dialogs:
    name: Real Windows 8 menus, 5 settings tabs, 4 modal top-layer checks
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'integration/final-rust-migration-20261116'
    needs: windows-p1p2-real-exe
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require syntactically valid real Windows screen audit
        run: node --check scripts/final-windows-full-screen-audit.mjs
      - name: Reuse binary from this exact Git SHA
        uses: actions/download-artifact@v4
        with:
          name: tsbh-final-rust-exact-head-ci-exe
          path: native-exe
      - name: Verify binary SHA256 unchanged
        shell: pwsh
        run: |
          $exe = "native-exe/bando_hub.exe"
          $digest = "native-exe/bando_hub.exe.sha256"
          if (!(Test-Path $exe) -or !(Test-Path $digest)) { throw "EXE or checksum missing" }
          $expected = ((Get-Content $digest -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw "Screen audit binary differs from Rust IPC binary" }
          Write-Host "Verified exact Windows EXE SHA256: $actual"
      - name: Install WebView2 inspector, not browser emulator
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.1
      - name: Real Windows menu, settings, modal and geometry audit
        env:
          BANDO_NATIVE_EXE: ${{ github.workspace }}\native-exe\bando_hub.exe
          BANDO_NATIVE_OUT: native-full-screen-evidence
          BANDO_NATIVE_BIN_COMMIT: ${{ github.sha }}
        run: node scripts/final-windows-full-screen-audit.mjs
      - name: Preserve all Windows GUI screenshots, geometry and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsbh-final-rust-native-8menus-5settings-4modals
          path: native-full-screen-evidence/
          if-no-files-found: warn
          retention-days: 14

  # Populated management tables must be audited from actual Rust state_save +
  # persisted developer TEST SQLite, not an empty-state screenshot/mock React.
  windows-populated-tables:
    name: Real Windows populated orders, prices and freight table layout
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'integration/final-rust-migration-20261116'
    needs: windows-p1p2-real-exe
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify populated table audit syntax
        run: node --check scripts/final-windows-populated-tables.mjs
      - name: Reuse exact-head Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: tsbh-final-rust-exact-head-ci-exe
          path: native-exe
      - name: Verify EXE SHA256 before synthetic order save
        shell: pwsh
        run: |
          $exe = "native-exe/bando_hub.exe"
          $digest = "native-exe/bando_hub.exe.sha256"
          if (!(Test-Path $exe) -or !(Test-Path $digest)) { throw "EXE or SHA256 missing" }
          $expected = ((Get-Content $digest -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw "Populated-table EXE does not match source head" }
          Write-Host "Verified exact Windows EXE SHA256: $actual"
      - name: Install CDP inspector for native WebView2
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.1
      - name: Confirm 20 synthetic orders through Rust and audit populated UI
        env:
          BANDO_NATIVE_EXE: ${{ github.workspace }}\native-exe\bando_hub.exe
          BANDO_NATIVE_OUT: populated-tables-evidence
          BANDO_NATIVE_BIN_COMMIT: ${{ github.sha }}
        run: node scripts/final-windows-populated-tables.mjs
      - name: Archive populated-table screenshots and precise geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsbh-final-rust-native-populated-20orders-60shipments
          path: populated-tables-evidence/
          if-no-files-found: warn
          retention-days: 14

  # One required green or red conclusion for PRs targeting main, main pushes,
  # and the former integration branch. No missing/skipped/failed suite may pass.
  final-rust-migration-gate:
    name: "Rust migration integration regression gate"
    if: ${{ always() && (github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'integration/final-rust-migration-20261116') }}
    needs:
      - output-rust
      - frontend
      - windows-native
      - windows-p1p2-real-exe
      - windows-client-registration-persistence
      - windows-all-menus-dialogs
      - windows-populated-tables
      - output-ts-rust-parity
      - order-save-ts-rust-parity
      - rules-comprehensive-parity
      - integrated-rust-core
      - react-native-reception
      - factory-reply-ts-rust-parity
      - factory-reply-native-windows
      - history-ts-rust-parity
    runs-on: ubuntu-latest
    steps:
      - name: Require all fifteen verified gates to succeed
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          node - <<'NODE'
          const results = JSON.parse(process.env.GATE_RESULTS);
          const report = Object.entries(results).map(([name, value]) => ({
            name, result: value.result
          }));
          for (const item of report) {
            console.log(`${item.result === 'success' ? 'PASS' : 'BLOCKED'}: ${item.name} = ${item.result}`);
          }
          if (report.length !== 15 || report.some(item => item.result !== 'success')) {
            console.error('Rust integration CI BLOCKED. No missing or skipped job counts as success.');
            process.exitCode = 1;
          } else {
            console.log('MAIN RUST CI PASSED; installed Windows UX and real-data migration sign-off remain separate.');
          }
          NODE

name: Native Rust output and dispatcher regression
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/src/business_core/**'
      - 'src-tauri/resources/state-seed.json'
      - 'crates/bando-data-access/**'
      - 'tests/rust-migration/**'
      - '.github/workflows/migration-output.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/src/business_core/**'
      - 'src-tauri/resources/state-seed.json'
      - 'crates/bando-data-access/**'
      - 'tests/rust-migration/**'
      - '.github/workflows/migration-output.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-rust-output-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-core-batch:
    name: Native Rust output and integrated dispatcher (shared target)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Preserve compiled Rust dependencies in the actual shared Cargo target.
      # The previous registry-only cache still recompiled dependencies each run.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bando-rust-core-parity
          workspaces: |
            tests/rust-migration/output -> ../../../.cargo-target
            tests/rust-migration/integration -> ../../../.cargo-target
            tests/rust-migration/recognition -> ../../../.cargo-target
            tests/rust-migration/rules -> ../../../.cargo-target
      - name: Compile and run independent Rust output tests
        run: cargo test --manifest-path tests/rust-migration/output/Cargo.toml
      - name: Execute actual three-domain Rust dispatcher tests
        run: cargo test --manifest-path tests/rust-migration/integration/Cargo.toml -- --nocapture
      - name: Verify supplied Hongcheon school order through native recognition
        run: cargo test --manifest-path tests/rust-migration/recognition/Cargo.toml hongcheon_school_reception_keeps_two_phones_and_three_order_quantities -- --nocapture
      - name: Verify 20 native reception documents and exact recipient ownership
        run: cargo test --manifest-path tests/rust-migration/recognition/Cargo.toml regressions::order_ -- --nocapture
      - name: Verify native recipient regressions and evidence links without TypeScript
        run: cargo test --manifest-path tests/rust-migration/recognition/Cargo.toml recipient_regressions:: -- --nocapture
      - name: Verify ten native institution and recipient boundary cases
        run: cargo test --manifest-path tests/rust-migration/recognition/Cargo.toml regressions::institution_ -- --nocapture
      - name: Verify independent native price, freight, VAT and workflow contracts
        run: 'cargo test --manifest-path tests/rust-migration/rules/Cargo.toml regression:: -- --nocapture'
      - name: Verify live recipient-level reception quote and VAT calculations
        run: cargo test --manifest-path tests/rust-migration/rules/Cargo.toml rules::pricing::migration_tests -- --nocapture
      - name: Verify live native tariff and remote-area rules
        run: 'cargo test --manifest-path tests/rust-migration/rules/Cargo.toml rules::shipping:: -- --nocapture'
      - name: Verify native factory reply matching, conflict and row safety
        run: cargo test --manifest-path tests/rust-migration/rules/Cargo.toml rules::factory_reply::tests -- --nocapture
      - name: Verify native order history dates, tracking and payment evidence
        run: cargo test --manifest-path tests/rust-migration/rules/Cargo.toml rules::history::tests -- --nocapture

[package]
name = "bando-data-access"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared BANDO HUB v2 relational read projection"

[dependencies]
rusqlite = { version = "0.32", features = ["backup"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
url = "2"
regex = "1"
unicode-normalization = "0.1"
scraper = "0.23"

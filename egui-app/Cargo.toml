[package]
name = "bando-hub-egui"
version = "0.8.0"
edition = "2021"
publish = false
description = "BANDO HUB native Windows application"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
regex = "1"
arboard = "3"
serde_json = "1"
# Existing React catalog photos (manual data URI / bundled site images).
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "=0.21.7"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
rusqlite = { version = "=0.41.1", features = ["bundled", "fallible_uint"] }
bando-data-access = { path = "../crates/bando-data-access" }
calamine = "0.38"
zip = { version = "=9.8.2", default-features = false }
quick-xml = "=0.42.0"
sha2 = "0.10"
open = "5"
rust_xlsxwriter = "=0.104.0"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.15"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
